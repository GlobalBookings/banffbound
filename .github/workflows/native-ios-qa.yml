name: Native iOS Simulator QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-ios-qa.yml'
      - 'mobile/release/native-qa/**'

permissions:
  contents: read

concurrency:
  group: native-ios-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.event.repository.private == false
    # Standard public-repository runner, not a larger/billed runner.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      QA_ROOT: ${{ runner.temp }}/banffbound-native-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Build once and test actual native iPhone and iPad UI
        working-directory: mobile
        run: bash release/native-qa/run-ios-qa.sh
      - name: Extract bounded screenshots and truthful QA receipt
        if: always()
        working-directory: mobile
        run: python3 release/native-qa/extract-evidence.py "$QA_ROOT"
      - name: Retain small QA evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-simulator-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/banffbound-native-qa/evidence/
          retention-days: 1
          if-no-files-found: error
