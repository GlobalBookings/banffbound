# Validate that the Astro site builds successfully after data changes.
# Skipped for automated data-refresh commits ("[skip ci]" in message).

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Skip runs triggered by the data-refresh bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Check trip-planning behavior
        run: |
          node scripts/check-trip-planner.mjs
          node scripts/check-day-ideas.mjs
          node scripts/check-trail-directory.mjs
          node scripts/check-production-redirects.mjs

      - name: Check report source and expiry behavior
        run: |
          node scripts/check-weather-source.mjs
          node scripts/check-snow-source.mjs
          node scripts/check-source-freshness.mjs
          node scripts/check-road-source.mjs
          node scripts/check-town-events.mjs

      - name: Check booking navigation
        run: node scripts/check-affiliate-navigation.mjs

      # 4. Fetch data once, compile Astro and generate the Pagefind index.
      - name: Build site
        run: npm run build

      # Catch broken routes, assets and metadata in the winter planning cluster.
      - name: Audit generated site
        run: npm run audit:site
