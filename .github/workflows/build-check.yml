# Validate that the Astro site builds successfully after data changes.
# Skipped for automated data-refresh commits ("[skip ci]" in message).

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Skip runs triggered by the data-refresh bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Check trip-planning behavior
        run: |
          node scripts/check-trip-planner.mjs
          node scripts/check-day-ideas.mjs
          node scripts/check-trail-directory.mjs
          node scripts/check-trail-source-reviews.mjs
          node scripts/check-production-redirects.mjs
          node scripts/check-activities.mjs
          node scripts/check-paddling.mjs
          node scripts/check-paid-landings.mjs
          node research/check-banff-hotel-landing-2026-10-29.mjs
          node scripts/check-lake-louise-landing.mjs
          node scripts/check-winter-activity-landing.mjs
          node scripts/check-cycling-planning.mjs
          node scripts/check-internal-linker.mjs
          node scripts/check-blog-content.mjs
          node scripts/check-bow-lake-guides.mjs
          node scripts/check-jasper-guides.mjs
          node scripts/check-dining-guides.mjs
          node scripts/check-cabin-planning.mjs
          node scripts/check-article-booking-context.mjs
          node scripts/check-nightlife-guide.mjs
          node scripts/check-live-music-guide.mjs
          node scripts/check-drink-offer-guide.mjs
          node scripts/check-evening-planning.mjs
          node scripts/check-parkway-guides.mjs
          node scripts/check-minnewanka-guide.mjs
          node scripts/check-gondola-guides.mjs
          node scripts/check-parkway-planning.mjs
          node scripts/check-lesson-planning.mjs
          node scripts/check-town-stay-planning.mjs
          node scripts/check-consent.mjs
          node scripts/check-affiliate-embeds.mjs
          node scripts/check-wildlife-planning.mjs
          node scripts/check-wildlife-safety.mjs
          node scripts/check-lake-planning.mjs
          node scripts/check-parking-planning.mjs
          node scripts/check-build-provenance.mjs
          node research/check-hotel-directory-quality-2026-10-29.mjs
          node research/check-rental-planning-2026-10-29.mjs

      - name: Check report source and expiry behavior
        run: |
          node scripts/check-weather-source.mjs
          node scripts/check-snow-source.mjs
          node scripts/check-source-freshness.mjs
          node scripts/check-road-source.mjs
          node scripts/check-town-events.mjs

      - name: Check booking navigation
        run: node scripts/check-affiliate-navigation.mjs

      # 4. Fetch data once, compile Astro and generate the Pagefind index.
      - name: Build site
        run: npm run build

      # Catch broken routes, assets and metadata in the winter planning cluster.
      - name: Audit generated site
        run: npm run audit:site
